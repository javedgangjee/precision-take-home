<app-stream-badge />
<hr />
<div class="control">
  <label for="grid-size" class="control-label">Grid size</label>
  <div class="control-row">
    <button
      type="button"
      class="md-btn"
      aria-label="Decrease grid size"
      [style.visibility]="atMin() ? 'hidden' : null"
      (click)="change(-1)"
    >
      <span class="material-symbols-outlined" aria-hidden="true">remove</span>
    </button>
    <div class="field">
      <input id="grid-size" type="text" readonly [value]="sizeText()" (keydown)="onKey($event)" />
    </div>
    <button
      type="button"
      class="md-btn"
      aria-label="Increase grid size"
      [style.visibility]="atMax() ? 'hidden' : null"
      (click)="change(1)"
    >
      <span class="material-symbols-outlined" aria-hidden="true">add</span>
    </button>
  </div>
</div>
<hr />
<div class="readouts">
  <div class="md-readout">
    <div class="md-readout-value">{{ samplesText() }}</div>
    <div class="md-readout-label">Samples received</div>
  </div>
  <hr />
  <div class="md-readout">
    <div class="md-readout-value">{{ maxText() }}</div>
    <div class="md-readout-label">Max count</div>
  </div>
  <hr />
  <div class="md-readout">
    <div class="md-readout-value">{{ store.fps() }}<span class="md-readout-unit"> fps</span></div>
    <div class="md-readout-label">Frame rate</div>
    @if (store.fpsWarning(); as warning) {
      <p class="danger-text">{{ warning }}</p>
    }
  </div>
  <hr />
</div>
